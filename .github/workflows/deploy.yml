name: Deploy to Main Site

on:
  push:
    branches:
      - main # 如果你的默认分支是 master，请改为 master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' 

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npm run docs:build
        # 注意：确保你的项目配置了正确的 base 路径
        # 例如 Vite 项目需在 vite.config.js 设置 base: '/projectA/'

      - name: Deploy to tolerious.github.io
        uses: peaceiris/actions-gh-pages@v3
        with:

          personal_token: ${{ secrets.BABEL_HANDBOOK }}
          
          external_repository: tolerious/tolerious.github.io
          
          publish_dir: .vitepress/dist
          
          destination_dir: babel-handbook
          
          keep_files: true